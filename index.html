<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTO_AGEXT | Minimal Drive Links</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="theme.js"></script>
</head>

<body>
  <ul class="background-bubbles">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <nav class="navbar">
    <a href="./" class="logo">PHOTO_AGEXT</a>
    <div class="nav-right">
      <a href="#searchInput" class="search-nav-btn" onclick="setTimeout(() => document.getElementById('searchInput').focus(), 100);" title="ค้นหาโฟลเดอร์">
        <i class="fas fa-search"></i>
      </a>
      <div class="theme-switch-wrapper">
        <label class="theme-switch" for="themeToggleSwitch">
          <input type="checkbox" id="themeToggleSwitch" />
          <div class="slider">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
          </div>
        </label>
      </div>
      <div class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="./">Gallery</a>
      <a href="documents.html">เอกสารต่างๆ</a>
      <a href="grade.html">ระบบตรวจเกรด</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Photo Collections</h1>
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาโฟลเดอร์... (พิมพ์ชื่อโฟลเดอร์)">
      </div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Cards will be injected here via JavaScript -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="creator-info">
        <p>Created by <strong>Your Name</strong> <i class="fas fa-lock admin-trigger" onclick="openAdminModal()" title="Admin Login"></i></p>
      </div>
      <div class="social-links">
        <a href="https://instagram.com" target="_blank" class="social-btn ig" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
      </div>
    </div>
  </footer>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="admin-login-modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAdminModal()">&times;</span>
      <h2><i class="fas fa-user-shield" style="color: var(--accent-color); margin-bottom: 10px;"></i><br>Admin Access</h2>
      <p>Please enter the passcode to continue</p>
      <input type="password" id="adminPasscode" class="admin-passcode-input" placeholder="••••••••" autocomplete="off" onkeypress="if(event.key === 'Enter') verifyAdmin()">
      <button class="submit-btn" onclick="verifyAdmin()">Login</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
